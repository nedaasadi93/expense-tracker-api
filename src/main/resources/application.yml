server:
  port: 8080
  servlet:
    context-path: /api/v1


spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker?currentSchema=expense_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_schema: expense_tracker
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:database/changelog/changelog-master.xml

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

logging:
  level:
    org:
      springframework:
        web: trace
      hibernate:
        type:
          descriptor:
            sql:
              basicBinder: trace
        sql: trace
        orm:
          jdbc:
            bind: trace

security:
  jwt:
    access:
      secret: 23FBAF13FB5469299A1878CCAB3DA23FBAF13FB5469299A1878CCAB3DA
      expiration: 3600000
    refresh:
      secret: FBE673D3BC311C9D8919DBB5CFABAFBE673D3BC311C9D8919DBB5CFABA
      expiration: 604800000

otp:
  duration:
    120
  max-attempts:
    3
  max-request:
    3




